name: Deploy Next.js to Hostinger

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:  # Botón manual
  repository_dispatch:  # Webhook desde Laravel
    types: [rebuild-frontend]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_URL }}
          NEXT_PUBLIC_WHATSAPP_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_WHATSAPP_SERVICE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rsync
        run: |
          rsync -avz --delete \
            --exclude='back/' \
            --exclude='api/' \
            --exclude='.htaccess' \
            --exclude='.git/' \
            --exclude='*.log' \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            ./out/ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/yuntaspublicidad.com/public_html/
      
      - name: Notify Laravel on completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -X POST https://apiyuntas.yuntaspublicidad.com/api/webhooks/deploy-frontend-complete \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Token: ${{ secrets.WEBHOOK_TOKEN }}" \
            -d "{\"status\": \"$STATUS\", \"timestamp\": \"$(date -Iseconds)\", \"workflow_run_id\": \"${{ github.run_id }}\"}" \
            -v \
            --max-time 10 \
            --retry 2 \
            || echo "No se pudo notificar a Laravel (no crítico)"
      - name: Final status
        if: success()
        run: echo "✅ Deploy completado en $(date)"