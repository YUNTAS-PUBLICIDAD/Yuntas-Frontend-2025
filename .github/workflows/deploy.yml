name: Deploy Next.js to Hostinger

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:  # Botón manual
  repository_dispatch:  # Webhook desde Laravel
    types: [rebuild-frontend]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Clear Next.js cache
        run: |
          rm -rf .next
          rm -rf out

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_URL }}
          NEXT_PUBLIC_WHATSAPP_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_WHATSAPP_SERVICE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rsync
        run: |
          rsync -avz --delete \
            --exclude='back/' \
            --exclude='api/' \
            --exclude='.htaccess' \
            --exclude='.git/' \
            --exclude='*.log' \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            ./out/ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/yuntaspublicidad.com/public_html/
      
      - name: Notify completion
        if: success()
        run: echo "✅ Deploy completado en $(date)"